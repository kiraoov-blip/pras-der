name: Deploy PRAS-DER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 정적 빌드
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Check application types
        run: npm run typecheck

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          # 커스텀 도메인(simulator-kepco.co.kr)은 루트에서 서비스되므로
          # basePath에 /<저장소명>을 붙이지 않는다.
          # 기본 kiraoov-blip.github.io/pras-der/ 주소로 되돌리려면 이 줄을 지운다.
          PAGES_CUSTOM_DOMAIN: "true"
        run: npm run build:github-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: 배포
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
